name: Make THE WALL real

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace demo frontend with live data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          s = s.replace('id="claimed">73,421', 'id="claimed">0')
          s = s.replace('width:7.3421%', 'width:0%')
          s = s.replace('.cell{background:#171a21;', '.cell{background:#171a21;border:1px solid #252a34;')

          wall_pattern = r'const recentData=.*?let seconds=18\*3600\+42\*60\+9;function tick\(\).*?setInterval\(tick,1000\);'
          wall_replacement = '''const recentData=[];
const recent=document.getElementById("recent");
const wall=document.getElementById("wall");
const cells=10000;
for(let i=1;i<=cells;i++){
  const c=document.createElement("div");
  c.className="cell";
  c.dataset.brick=i;
  c.onclick=()=>openClaim();
  wall.appendChild(c);
}

async function loadRealWall(){
  try{
    const stats=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/stats").then(r=>r.json());
    const claimed=Number(stats.claimed||0);
    const total=Number(stats.total||1000000);
    document.getElementById("claimed").textContent=claimed.toLocaleString();
    document.querySelector(".bar").style.width=Math.min(100,claimed/total*100)+"%";
    document.querySelector(".progress-label").textContent=(claimed/total*100).toFixed(2)+"% OF THE WALL CLAIMED";
    const visibleClaimed=Math.min(cells,Math.round((claimed/total)*cells));
    document.querySelectorAll("#wall .cell").forEach((c,i)=>{
      if(i<visibleClaimed)c.classList.add("claimed");
    });

    const recentData=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/recent").then(r=>r.json());
    const box=document.getElementById("recent");
    box.innerHTML="";
    recentData.forEach(x=>{
      box.innerHTML+=`<div class="brick"><div class="mini"></div><div><div class="brickno">#${x.id}</div><div class="brickname">${escapeHtml(x.name)}</div><div class="brickmsg">"${escapeHtml(x.message||"")}"</div></div></div>`;
    });
    if(!recentData.length) box.innerHTML='<div style="color:var(--muted);font-size:13px">No bricks claimed yet. Be the first.</div>';
  }catch(e){
    document.getElementById("recent").innerHTML='<div style="color:var(--muted);font-size:13px">Wall data is temporarily unavailable.</div>';
  }
}

function escapeHtml(v){return String(v).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
loadRealWall();'''
          s2, n = re.subn(wall_pattern, wall_replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Frontend demo wall block not found')
          s = s2

          search_pattern = r'const brickSearch=.*?function searchBricks\(\).*?\nfunction shareBrick'
          search_replacement = '''async function searchBricks(){
  const q=document.getElementById("search").value.trim();
  const out=document.getElementById("searchResult");
  if(!q){out.innerHTML="";return}
  try{
    const results=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/search?q="+encodeURIComponent(q)).then(r=>r.json());
    out.innerHTML=results.length?results.map(x=>`<div class="history-row" style="display:block"><strong>#${x.id} · ${escapeHtml(x.name)}</strong><br><span>"${escapeHtml(x.message||"")}" · Claimed ${escapeHtml(x.claimed_at||"")}</span><br><button class="bidbtn" style="width:auto;padding:8px 12px;margin-top:9px" onclick="shareBrick('${x.id}')">SHARE BRICK →</button></div>`).join(""):'<div style="color:var(--muted);font-size:13px">No brick found.</div>';
  }catch(e){out.innerHTML='<div style="color:var(--muted);font-size:13px">Search is temporarily unavailable.</div>'}
}
function shareBrick'''
          s2, n = re.subn(search_pattern, search_replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Frontend demo search block not found')
          s = s2

          s = re.sub(r'<section class="panel history">.*?</section>', '<section class="panel history"><div class="panel-title">Limelight history</div><div class="history-row"><span>History</span><strong>No auction winners yet.</strong></div></section>', s, count=1, flags=re.S)
          s = s.replace('<div class="featured-name" id="featuredName">Alex Morgan</div>', '<div class="featured-name" id="featuredName">No Limelight yet</div>')
          s = s.replace('<div class="message" id="featuredMsg">"I was here before everyone else."</div>', '<div class="message" id="featuredMsg">The first Limelight will appear after the first auction.</div>')
          s = s.replace('★ WINNER OF YESTERDAY\'S AUCTION', 'NO WINNER YET')
          s = s.replace('<strong id="bid">$47</strong>', '<strong id="bid">$0</strong>')
          s = s.replace('18:42:09', '— — : — — : — —')
          s = s.replace('The auction is open. Bids are anonymous until the countdown ends.', 'The Limelight auction will appear here when it is live.')
          s = re.sub(r'function demoBid\(\)\{.*?\nfunction', 'function demoBid(){alert("The Limelight auction is not live yet.")}\nfunction', s, count=1, flags=re.S)

          p.write_text(s)
          PY
      - name: Commit final frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make THE WALL live" || exit 0
          git push
