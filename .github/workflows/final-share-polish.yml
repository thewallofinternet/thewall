name: Final share polish v2

on:
  push:
    paths:
      - '.github/workflows/final-share-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sharing to brick popup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="brick-link" id="brickLink" href="#">OPEN PERMANENT LINK →</a>'
          new = old + '<div style="display:flex;gap:8px;margin-top:14px"><button class="bidbtn" style="margin-top:0;flex:1" onclick="copyVisibleBrickLink()">COPY LINK</button><button class="bidbtn" style="margin-top:0;flex:1" onclick="shareVisibleBrick()">SHARE</button></div>'
          if old not in s:
              raise SystemExit('brick link pattern not found')
          s = s.replace(old, new, 1)
          marker = 'async function handleReturn(){'
          insert = '''async function copyVisibleBrickLink(){const link=document.getElementById('brickLink').href;if(!link||link==='#')return;try{await navigator.clipboard.writeText(link);alert('Permanent brick link copied!')}catch(e){prompt('Copy your permanent brick link:',link)}}\nasync function shareVisibleBrick(){const link=document.getElementById('brickLink').href;const id=document.getElementById('brickId').textContent;const name=document.getElementById('brickName').textContent;const data={title:"I'm on THE WALL",text:`${name} is now part of internet history — BRICK ${id}`,url:link};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(`${data.text} ${link}`);alert('Share text copied to your clipboard.')}}catch(e){}}\n'''
          if marker not in s:
              raise SystemExit('script marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add sharing to brick popup"
          git push
