name: Connect THE WALL to live data

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('const recentData=[["#73,421","Alex Morgan","I was here before everyone else."],["#73,420","Sarah","Let\'s fill this thing."],["#73,419","Chris","One tiny square."],["#73,418","DOGE","Much history."],["#73,417","Mika","Hello, future internet."],["#73,416","Anonymous","You found me."],["#73,415","Jamie","Had to be here."],["#73,414","Leo","Worth the dollar."],["#73,413","Nora","See you at a million."],["#73,412","Sam","I was here."]];\nconst recent=document.getElementById("recent");recentData.forEach(x=>{recent.innerHTML+=`<div class="brick"><div class="mini"></div><div><div class="brickno">${x[0]}</div><div class="brickname">${x[1]}</div><div class="brickmsg">"${x[2]}"</div></div></div>`});', 'const recent=document.getElementById("recent");\nfunction renderRecent(data){recent.innerHTML=data.map(x=>`<div class="brick"><div class="mini"></div><div><div class="brickno">#${x.id}</div><div class="brickname">${escapeHtml(x.name)}</div><div class="brickmsg">"${escapeHtml(x.message||"")}"</div></div></div>`).join("")}\nfunction escapeHtml(v){return String(v).replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]))}')
          s = s.replace('const wall=document.getElementById("wall"),cells=6400,filled=1100;for(let i=1;i<=cells;i++){let c=document.createElement("div");c.className="cell"+(i<=filled?" claimed":"");c.onclick=()=>{if(!c.classList.contains("claimed"))openClaim()};wall.appendChild(c)}', 'const wall=document.getElementById("wall"),cells=6400;function renderWall(count){wall.innerHTML="";const filled=Math.round(Math.min(count,1000000)/1000000*cells);for(let i=1;i<=cells;i++){let c=document.createElement("div");c.className="cell"+(i<=filled?" claimed":"");c.onclick=()=>{if(!c.classList.contains("claimed"))openClaim()};wall.appendChild(c)}}')
          start=s.index('const brickSearch=')
          end=s.index('function shareBrick', start)
          replacement='async function searchBricks(){const q=document.getElementById("search").value.trim(),out=document.getElementById("searchResult");if(!q){out.innerHTML="";return}try{const r=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/search?q="+encodeURIComponent(q));const matches=await r.json();out.innerHTML=matches.length?matches.slice(0,5).map(x=>`<div class="history-row" style="display:block"><strong>#${x.id} · ${escapeHtml(x.name)}</strong><br><span>"${escapeHtml(x.message||"")}" · Claimed ${new Date(x.claimed_at).toLocaleDateString()}</span><br><button class="bidbtn" style="width:auto;padding:8px 12px;margin-top:9px" onclick="shareBrick(\'#${x.id}\')">SHARE BRICK →</button></div>`).join(""):"<div style=\"color:var(--muted);font-size:13px\">No brick found.</div>"}catch(e){out.innerHTML="<div style=\"color:var(--muted);font-size:13px\">Search temporarily unavailable.</div>"}}\n'
          s=s[:start]+replacement+s[end:]
          s=s.replace('<span id="claimed">73,421</span>', '<span id="claimed">—</span>')
          s=s.replace('width:7.3421%', 'width:0%')
          s=s.replace('<div class="progress-label">7.34% OF THE WALL CLAIMED</div>', '<div class="progress-label" id="progressLabel">LOADING THE WALL…</div>')
          s=s.replace('</script>\n</body>', '''async function loadLiveData(){try{const r=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/stats");const d=await r.json();const count=Number(d.claimed||0);document.getElementById("claimed").textContent=count.toLocaleString();document.querySelector(".bar").style.width=((count/1000000)*100).toFixed(4)+"%";document.getElementById("progressLabel").textContent=((count/1000000)*100).toFixed(2)+"% OF THE WALL CLAIMED";renderWall(count);const rr=await fetch("https://the-wall-api.michael-christopher-englund.workers.dev/api/recent");renderRecent(await rr.json())}catch(e){document.getElementById("progressLabel").textContent="THE WALL IS LIVE";renderWall(0)}}\nloadLiveData();\n</script>\n</body>''')
          p.write_text(s)
          PY
      - name: Remove this temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-data-fix.yml
          git add index.html
          git commit -m "Connect wall frontend to live database"
          git push