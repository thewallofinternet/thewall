name: Fix duplicate share buttons

on:
  push:
    paths:
      - '.github/workflows/fix-duplicate-share.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          block='<div style="display:flex;gap:8px;margin-top:14px"><button class="bidbtn" style="margin-top:0;flex:1" onclick="copyVisibleBrickLink()">COPY LINK</button><button class="bidbtn" style="margin-top:0;flex:1" onclick="shareVisibleBrick()">SHARE</button></div>'
          if s.count(block) > 1:
              first=s.find(block)
              second=s.find(block, first+len(block))
              s=s[:second]+s[second+len(block):]
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate share buttons"
          git rm .github/workflows/fix-duplicate-share.yml
          git commit -m "Remove temporary fix workflow"
          git push
