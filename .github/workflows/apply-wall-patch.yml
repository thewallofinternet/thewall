name: Apply wall patch

on:
  push:
    branches:
      - main

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: python scripts/make_wall_real.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/make_wall_real.py
          git commit -m "Make THE WALL live" || exit 0
          git push
