name: Fix checkout error display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix checkout error display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout error handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''    const data=await r.json();
    if(!r.ok || !data.url) throw new Error(data.error||"Could not create checkout");
    window.location.href=data.url;
  }catch(e){
    alert("Checkout could not be started.\\n\\n"+e.message);
    btn.disabled=false; btn.textContent="CLAIM FOR $1 →";
  }'''
          new = '''    const raw=await r.text();
    let data={};
    try{data=raw?JSON.parse(raw):{};}catch(_){data={error:raw};}
    if(!r.ok || !data.url){
      const detail=data.details || data.message || data.error || `HTTP ${r.status}`;
      throw new Error(detail);
    }
    window.location.href=data.url;
  }catch(e){
    alert("Checkout could not be started.\\n\\n"+e.message);
    btn.disabled=false; btn.textContent="CLAIM FOR $1 →";
  }'''
          if old not in s:
              raise SystemExit('Expected checkout block was not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix checkout error display"
          git push
